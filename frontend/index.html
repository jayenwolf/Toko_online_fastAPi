<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online</title>

    <!-- Ini untuk menyambungkan HTML dengan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Membungkus semua class yang bernama kartu agar bisa diatur posisinya -->
    <div class="kumpulan-produk">


        <div class="kartu-produk">
            <img src="img/sepatu.png" alt="Sepatu Kets" width="200">
            <h2>Sepatu Kets</h2>
            <p>Rp 150.000</p>
            <button type="button">Beli Sekarang</button>
        </div>


        <div class="kartu-produk">
            <img src="img/baju.png" alt="Baju Kemeja" width="200">
            <h2>Baju Kemeja</h2>
            <p>Rp 120.000</p>
            <button type="button">Beli Sekarang</button>
        </div>


        <div class="kartu-produk">
            <img src="img/celana.png" alt="Celana Jeans" width="200">
            <h2>Celana Jeans</h2>
            <p>Rp 200.000</p>
            <button type="button">Beli Sekarang</button>
        </div>

        <div class="kartu-produk">
            <img src="img/jaket.png" alt="Jaket Parasut" width="200">
            <h2>Jaket Parasut</h2>
            <p>Rp 250.000</p>
            <button type="button">Beli Sekarang</button>
        </div>

        <div class="kartu-produk">
            <img src="img/sendal.png" alt="Sendal Santai" width="200">
            <h2>Sendal Santai</h2>
            <p>Rp 50.000</p>
            <button type="button">Beli Sekarang</button>
        </div>

    </div>


</body>
</html>
